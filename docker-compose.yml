services:
  wiki:
    build:
      context: ../
      dockerfile: build/Dockerfile
      args:
        AL_VERSION: ${AL_VERSION}
        AR_VERSION: ${AR_VERSION}
        BROWSER_TESTS: ${BROWSER_TESTS}
        CHAMELEON_VERSION: ${CHAMELEON_VERSION}
        COMPOSER_EXT: ${COMPOSER_EXT}
        DT_VERSION: ${DT_VERSION}
        ECHO_VERSION: ${ECHO_VERSION}
        EXTENSION: ${EXTENSION}
        MAPS_VERSION: ${MAPS_VERSION}
        MM_VERSION: ${MM_VERSION}
        LINGO_VERSION: ${LINGO_VERSION}
        SCRIBUNTO_VERSION: ${SCRIBUNTO_VERSION}
        MW_INSTALL_PATH: ${MW_INSTALL_PATH}
        MW_VERSION: ${MW_VERSION}
        NODE_JS: ${NODE_JS}
        PF_REPO: ${PF_REPO}
        PF_VERSION: ${PF_VERSION}
        PHP_EXTENSIONS: ${PHP_EXTENSIONS}
        OS_PACKAGES: ${OS_PACKAGES}
        PHP_VERSION: ${PHP_VERSION}
        PS_VERSION: ${PS_VERSION}
        SMW_VERSION: ${SMW_VERSION}
        SRF_VERSION: ${SRF_VERSION}
      secrets:
        - GH_API_TOKEN
    image: ${IMAGE_NAME}
    
  mysql:
    image: ${DB_IMAGE:-mysql:5}
    environment:
      - MYSQL_ROOT_PASSWORD=database
    profiles:
      - mysql

  postgres:
    image: ${DB_IMAGE:-postgres:15}
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=database
    profiles:
      - postgres

  wait-for:
    image: mintel/docker-wait-for-it
    profiles:
      - no-up

secrets:
  # GitHub token for extensions with "private": true in extensions.local.json. Taken from the environment
  # of the build (the Makefile exports it); an unset variable gives an empty secret.
  GH_API_TOKEN:
    environment: GH_API_TOKEN
